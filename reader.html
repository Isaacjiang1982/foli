<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>佛经阅读</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    if (!window.tailwind) {
      document.write('<script src="tailwindcss.js?v=22.1"><\/script>');
    }
  </script>
  <style>
    :root {
      --reader-paper: rgba(255, 252, 244, 0.84);
      --reader-paper-border: rgba(145, 96, 38, 0.14);
      --reader-text: #3f3127;
      --reader-muted: rgba(91, 64, 51, 0.68);
      --reader-accent: #9a541c;
      --reader-gold: #d9a441;
      --reader-shadow: 0 24px 70px rgba(83, 54, 24, 0.13);
      --reader-font-family: "I.Ming", "SimSun", "Songti SC", "STSong", "Noto Serif SC", serif;
      --reader-font-tracking: 0.01em;
    }
    body {
      font-family: var(--reader-font-family);
      color: var(--reader-text);
      background:
        radial-gradient(ellipse at 82% -8%, rgba(255,255,238,.82) 0%, rgba(245,218,145,.34) 36%, transparent 66%),
        radial-gradient(ellipse at 8% 100%, rgba(172,119,53,.22) 0%, transparent 54%),
        linear-gradient(145deg, #d6b773 0%, #f2e4c8 34%, #f8efd9 58%, #d6bd86 100%);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
    }
    body.reader-night {
      --reader-paper: rgba(34, 28, 23, 0.9);
      --reader-paper-border: rgba(218, 171, 87, 0.18);
      --reader-text: #eadbc1;
      --reader-muted: rgba(234, 219, 193, 0.66);
      --reader-accent: #e0aa55;
      --reader-gold: #bd8b3e;
      --reader-shadow: 0 24px 70px rgba(0, 0, 0, 0.42);
      background:
        radial-gradient(ellipse at 80% 0%, rgba(139, 93, 35, .22) 0%, transparent 54%),
        linear-gradient(145deg, #0d0b09 0%, #18130f 42%, #231b14 100%);
    }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(154, 84, 28, .28); border-radius: 3px; }
    .reader-header {
      background: rgba(255, 250, 240, 0.66);
      border-bottom: 1px solid rgba(145, 96, 38, 0.12);
      box-shadow: 0 10px 30px rgba(84, 55, 22, 0.08);
    }
    .reader-night .reader-header { background: rgba(22, 18, 15, 0.75); }
    body.reader-font-songke {
      --reader-font-family: "I.Ming", "SimSun", "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", serif;
      --reader-font-tracking: 0.012em;
    }
    body.reader-font-script {
      --reader-font-family: "Kaiti SC", "STKaiti", "KaiTi", "FangSong", "FangSong_GB2312", "Songti SC", serif;
      --reader-font-tracking: 0.035em;
    }
    body.reader-font-system {
      --reader-font-family: "Noto Serif SC", "Songti SC", "STSong", "PingFang SC", -apple-system, BlinkMacSystemFont, serif;
      --reader-font-tracking: 0;
    }
    .reader-icon-btn {
      width: 2.35rem;
      height: 2.35rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      color: var(--reader-accent);
      background: rgba(255,255,255,0.36);
      border: 1px solid rgba(145, 96, 38, 0.12);
      transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
    }
    .reader-night .reader-icon-btn { background: rgba(255,255,255,0.06); }
    .reader-icon-btn:hover { background: rgba(255,255,255,0.55); box-shadow: 0 8px 18px rgba(122, 79, 26, .1); }
    .reader-icon-btn:active { transform: scale(.94); }
    .reader-shell {
      background:
        linear-gradient(90deg, rgba(255,255,255,.18), transparent 12%, transparent 88%, rgba(127,85,29,.06)),
        var(--reader-paper);
      border: 1px solid var(--reader-paper-border);
      box-shadow: var(--reader-shadow), inset 0 0 0 1px rgba(255,255,255,.34);
      border-radius: 22px;
    }
    .reader-night .reader-shell { box-shadow: var(--reader-shadow), inset 0 0 0 1px rgba(255,255,255,.03); }
    .reader-title-rule {
      width: min(180px, 42%);
      height: 1px;
      margin: 18px auto 0;
      background: linear-gradient(90deg, transparent, rgba(154, 84, 28, .38), transparent);
    }
    .reader-content {
      color: var(--reader-text);
      text-align: justify;
      white-space: pre-wrap;
      letter-spacing: var(--reader-font-tracking);
      word-break: break-word;
      overflow-wrap: anywhere;
    }
    .reader-content h2.reader-chapter {
      margin: 2.4em 0 1.1em;
      color: var(--reader-accent);
      font-size: 1.08em;
      font-weight: 800;
      text-align: center;
      letter-spacing: .04em;
    }
    .reader-panel {
      background: rgba(255, 252, 244, .88);
      border: 1px solid rgba(145, 96, 38, .14);
      box-shadow: 0 24px 60px rgba(50, 33, 15, .18);
    }
    .reader-night .reader-panel {
      background: rgba(33, 27, 22, .94);
      border-color: rgba(218,171,87,.16);
    }
    .reader-field {
      background: rgba(255,255,255,.48);
      border: 1px solid rgba(145, 96, 38, .12);
      color: var(--reader-text);
    }
    .reader-night .reader-field { background: rgba(255,255,255,.06); }
    .mode-btn.active {
      background: var(--reader-accent);
      color: white;
      border-color: transparent;
    }
    .font-btn.active {
      background: var(--reader-accent);
      color: white;
      border-color: transparent;
    }
    .highlight-match { background-color: rgba(245, 196, 83, .42); color: var(--reader-text); font-weight: bold; border-radius: 4px; padding: 0 2px; box-shadow: 0 0 0 1px rgba(217, 164, 65, .42); scroll-margin-top: 100px; }
    #minimap { position: fixed; right: 4px; top: 64px; bottom: 10px; width: 6px; z-index: 40; pointer-events: none; }
    .minimap-marker { position: absolute; left: 0; right: 0; height: 2px; background-color: var(--reader-gold); border-radius: 1px; opacity: 0.82; }
  </style>
  <!-- Load pre-bundled data if available (for offline mode) -->
  <script src="i18n.js?v=21.0"></script>
  <script src="sutras_data.js?v=21.0"></script>
  <script src="ai_chat.js?v=21.0"></script>
</head>
<body class="min-h-screen flex flex-col selection:bg-[#b35c1e] selection:text-white">

<header class="reader-header flex justify-between items-center px-4 py-3 backdrop-blur-xl sticky top-0 z-30 transition-all duration-300">
  <button onclick="goBack()" class="reader-icon-btn" aria-label="返回">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
    </svg>
  </button>
  <div id="header-title" class="text-base sm:text-lg font-bold truncate max-w-[48%] text-[var(--reader-text)]" data-i18n="reader_title">佛经阅读</div>
  <div class="flex gap-2">
      <button onclick="toggleToc()" class="reader-icon-btn" aria-label="目录">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
      </button>
      <button onclick="toggleBookmarks()" class="reader-icon-btn" aria-label="书签">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M17.6 21.75 12 18.25l-5.6 3.5A.9.9 0 0 1 5 21V5.25A2.25 2.25 0 0 1 7.25 3h9.5A2.25 2.25 0 0 1 19 5.25V21a.9.9 0 0 1-1.4.75Z"/></svg>
      </button>
      <button onclick="toggleSettings()" class="reader-icon-btn" aria-label="设置">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.592c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.66.84.079.035.157.071.234.109.335.164.73.135 1.04-.075l1.064-.72a1.125 1.125 0 0 1 1.45.12l1.833 1.833c.389.389.44 1.002.12 1.45l-.72 1.064c-.21.31-.239.705-.075 1.04.038.077.074.155.109.234.154.347.466.597.84.66l1.281.213c.542.09.94.56.94 1.11v2.592c0 .55-.398 1.02-.94 1.11l-1.281.213c-.374.063-.686.313-.84.66a6.896 6.896 0 0 1-.109.234c-.164.335-.135.73.075 1.04l.72 1.064c.32.448.269 1.061-.12 1.45l-1.833 1.833a1.125 1.125 0 0 1-1.45.12l-1.064-.72c-.31-.21-.705-.239-1.04-.075a6.896 6.896 0 0 1-.234.109c-.347.154-.597.466-.66.84l-.213 1.281c-.09.542-.56.94-1.11.94h-2.592c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.063-.374-.313-.686-.66-.84a6.896 6.896 0 0 1-.234-.109c-.335-.164-.73-.135-1.04.075l-1.064.72a1.125 1.125 0 0 1-1.45-.12L2.98 19.43a1.125 1.125 0 0 1-.12-1.45l.72-1.064c.21-.31.239-.705.075-1.04a6.896 6.896 0 0 1-.109-.234c-.154-.347-.466-.597-.84-.66l-1.281-.213a1.125 1.125 0 0 1-.94-1.11v-2.592c0-.55.398-1.02.94-1.11l1.281-.213c.374-.063.686-.313.84-.66.035-.079.071-.157.109-.234.164-.335.135-.73-.075-1.04l-.72-1.064a1.125 1.125 0 0 1 .12-1.45l1.833-1.833a1.125 1.125 0 0 1 1.45-.12l1.064.72c.31.21.705.239 1.04.075.077-.038.155-.074.234-.109.347-.154.597-.466.66-.84l.213-1.281Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg>
      </button>
  </div>
</header>

<main class="flex-1 px-3 py-5 sm:p-6 max-w-md lg:max-w-4xl mx-auto w-full relative">
    <div id="minimap"></div>
    <div id="content-container" class="reader-shell min-h-[calc(100vh-110px)] px-5 py-7 sm:px-8 lg:px-12 lg:py-10 transition-all duration-300">
        <div id="article-title" class="text-[1.65rem] sm:text-3xl font-bold text-[var(--reader-text)] text-center leading-snug pt-2"></div>
        <div class="reader-title-rule"></div>
        <div id="article-content" class="reader-content text-lg mt-8" style="font-size: 18px; line-height: 2;">
            <div class="flex flex-col items-center justify-center py-20 text-[var(--reader-muted)] gap-3">
                <svg class="animate-spin h-8 w-8 text-[#8B4513]" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span data-i18n="loading">正在載入文章...</span>
            </div>
        </div>
    </div>
</main>

<!-- Table of Contents Modal -->
<div id="toc-modal" class="fixed inset-0 z-50 hidden" style="display: none;">
    <div class="absolute inset-0 bg-black/20 backdrop-blur-sm transition-opacity" onclick="toggleToc()"></div>
    <div class="reader-panel absolute top-16 right-4 left-4 sm:left-auto sm:w-96 p-5 rounded-2xl backdrop-blur-2xl animate-in fade-in slide-in-from-top-4 duration-200">
        <div class="flex justify-between items-center mb-4 border-b border-[#8B4513]/10 pb-3">
            <span class="font-bold text-[var(--reader-text)]">目录</span>
            <button onclick="toggleToc()" class="reader-icon-btn !w-8 !h-8" aria-label="关闭">×</button>
        </div>
        <div id="toc-list" class="space-y-2 max-h-[60vh] overflow-y-auto pr-1 custom-scrollbar text-sm">
            <div class="text-center text-[var(--reader-muted)] py-6">正在生成目录...</div>
        </div>
    </div>
</div>

<!-- Bookmarks Modal -->
<div id="bookmarks-modal" class="fixed inset-0 z-50 hidden" style="display: none;">
    <div class="absolute inset-0 bg-black/20 backdrop-blur-sm transition-opacity" onclick="toggleBookmarks()"></div>
    <div class="reader-panel absolute top-16 right-4 left-4 sm:left-auto sm:right-16 sm:w-80 backdrop-blur-2xl p-5 rounded-2xl animate-in fade-in slide-in-from-top-4 duration-200">
        <div class="flex justify-between items-center mb-4 border-b border-[#8B4513]/10 pb-2">
            <span class="font-bold text-[var(--reader-text)] flex items-center gap-2">
                书签 (<span id="bookmark-count">0</span>/3)
            </span>
            <button onclick="toggleBookmarks()" class="reader-icon-btn !w-8 !h-8" aria-label="关闭">×</button>
        </div>
        
        <div class="space-y-3">
            <div id="bookmarks-list" class="space-y-2 max-h-60 overflow-y-auto pr-1 custom-scrollbar">
                <!-- Bookmarks will be injected here -->
            </div>

            <button id="add-bookmark-btn" onclick="addBookmark()" class="w-full py-2.5 rounded-xl bg-[var(--reader-accent)] text-white font-bold shadow-sm hover:shadow-md active:scale-[0.98] transition-all flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                <span>添加当前进度</span>
            </button>
        </div>
    </div>
</div>

<!-- Settings Modal -->
<div id="settings-modal" class="fixed inset-0 z-50 hidden" style="display: none;">
    <div class="absolute inset-0 bg-black/20 backdrop-blur-sm transition-opacity" onclick="toggleSettings()"></div>
    <div class="reader-panel absolute top-16 right-4 left-4 sm:left-auto sm:w-80 backdrop-blur-2xl p-5 rounded-2xl animate-in fade-in slide-in-from-top-4 duration-200">
        <div class="flex justify-between items-center mb-4 border-b border-[#8B4513]/10 pb-2">
            <span class="font-bold text-[var(--reader-text)] flex items-center gap-2" data-i18n="reader_settings">
                阅读设置
            </span>
            <button onclick="toggleSettings()" class="reader-icon-btn !w-8 !h-8" aria-label="关闭">×</button>
        </div>
        
        <div class="space-y-4">
             <!-- Language Selector -->
             <div>
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs text-[var(--reader-muted)] font-bold uppercase tracking-wider" data-i18n="language_label">语言 / Language</span>
                </div>
                <div class="flex gap-2">
                    <button onclick="setLanguage('zh-CN')" class="reader-field flex-1 py-1.5 rounded-xl text-xs font-medium hover:bg-white/60 transition-all active:scale-95">简体</button>
                    <button onclick="setLanguage('zh-TW')" class="reader-field flex-1 py-1.5 rounded-xl text-xs font-medium hover:bg-white/60 transition-all active:scale-95">繁體</button>
                    <button onclick="setLanguage('en')" class="reader-field flex-1 py-1.5 rounded-xl text-xs font-medium hover:bg-white/60 transition-all active:scale-95">En</button>
                </div>
            </div>

            <hr class="border-[#8B4513]/10">

            <div>
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs text-[var(--reader-muted)] font-bold uppercase tracking-wider">字体风格</span>
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <button id="font-songke-btn" onclick="setReaderFontStyle('songke')" class="font-btn reader-field py-2 rounded-xl text-sm font-medium transition-all active:scale-95">宋刻</button>
                    <button id="font-script-btn" onclick="setReaderFontStyle('script')" class="font-btn reader-field py-2 rounded-xl text-sm font-medium transition-all active:scale-95">写经</button>
                    <button id="font-system-btn" onclick="setReaderFontStyle('system')" class="font-btn reader-field py-2 rounded-xl text-sm font-medium transition-all active:scale-95">系统</button>
                </div>
            </div>

            <div>
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs text-[var(--reader-muted)] font-bold uppercase tracking-wider">阅读模式</span>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <button id="day-mode-btn" onclick="setReaderTheme('day')" class="mode-btn reader-field py-2 rounded-xl text-sm font-medium transition-all active:scale-95">日间</button>
                    <button id="night-mode-btn" onclick="setReaderTheme('night')" class="mode-btn reader-field py-2 rounded-xl text-sm font-medium transition-all active:scale-95">夜间</button>
                </div>
            </div>

            <div>
                <div class="flex justify-between text-xs text-[var(--reader-muted)] font-bold uppercase tracking-wider mb-2">
                    <span data-i18n="font_size_label">字體大小</span>
                    <span id="font-size-label" class="text-[var(--reader-accent)]">18px</span>
                </div>
                <input type="range" id="font-size-slider" min="14" max="32" step="1" value="18" 
                       class="w-full h-2 bg-[#8B4513]/20 rounded-lg appearance-none cursor-pointer accent-[#8B4513]"
                       oninput="updateFontSize(this.value)">
                <div class="flex justify-between text-[10px] text-[var(--reader-muted)] mt-1">
                    <span>A</span>
                    <span>A</span>
                </div>
            </div>

            <div>
                <div class="flex justify-between text-xs text-[var(--reader-muted)] font-bold uppercase tracking-wider mb-2">
                    <span>行距</span>
                    <span id="line-height-label" class="text-[var(--reader-accent)]">2.0</span>
                </div>
                <input type="range" id="line-height-slider" min="1.6" max="2.6" step="0.1" value="2"
                       class="w-full h-2 bg-[#8B4513]/20 rounded-lg appearance-none cursor-pointer accent-[#8B4513]"
                       oninput="updateLineHeight(this.value)">
            </div>
            
            <div class="reader-field p-3 rounded-xl text-justify leading-relaxed transition-all duration-200 text-xs" id="settings-preview-text" data-i18n="preview_text">
                預覽文字 Preview Text.<br>此設置僅影響佛經與開示的閱讀頁面。
            </div>
        </div>
    </div>
</div>

<script>
  function closeReaderPanels(exceptId) {
      ['toc-modal', 'bookmarks-modal', 'settings-modal'].forEach(id => {
          if (id !== exceptId) {
              const panel = document.getElementById(id);
              if (panel) panel.style.display = 'none';
          }
      });
  }

  function toggleToc() {
      const modal = document.getElementById('toc-modal');
      if (!modal) return;
      if (modal.style.display === 'none' || modal.style.display === '') {
          closeReaderPanels('toc-modal');
          buildToc();
          modal.style.display = 'block';
      } else {
          modal.style.display = 'none';
      }
  }

  function buildToc() {
      const list = document.getElementById('toc-list');
      const headings = Array.from(document.querySelectorAll('.reader-chapter'));
      if (!list) return;
      if (headings.length === 0) {
          list.innerHTML = '<div class="text-center text-[var(--reader-muted)] py-6">此文暂未识别到目录</div>';
          return;
      }
      list.innerHTML = headings.map((h, index) => {
          const title = h.getAttribute('data-toc-title') || h.textContent || `章节 ${index + 1}`;
          return `<button type="button" onclick="jumpToChapter('${h.id}')" class="block w-full text-left px-3 py-2.5 rounded-xl reader-field hover:bg-white/60 transition-colors">${escapeHtml(title)}</button>`;
      }).join('');
  }

  function jumpToChapter(id) {
      const target = document.getElementById(id);
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      const modal = document.getElementById('toc-modal');
      if (modal) modal.style.display = 'none';
  }

  function setReaderTheme(mode) {
      const theme = mode === 'night' ? 'night' : 'day';
      document.body.classList.toggle('reader-night', theme === 'night');
      localStorage.setItem('reader_theme', theme);
      updateThemeButtons();
  }

  function updateThemeButtons() {
      const theme = localStorage.getItem('reader_theme') === 'night' ? 'night' : 'day';
      const dayBtn = document.getElementById('day-mode-btn');
      const nightBtn = document.getElementById('night-mode-btn');
      if (dayBtn) dayBtn.classList.toggle('active', theme === 'day');
      if (nightBtn) nightBtn.classList.toggle('active', theme === 'night');
  }

  function setReaderFontStyle(style) {
      const selected = ['songke', 'script', 'system'].includes(style) ? style : 'songke';
      document.body.classList.remove('reader-font-songke', 'reader-font-script', 'reader-font-system');
      document.body.classList.add(`reader-font-${selected}`);
      localStorage.setItem('reader_font_style', selected);
      updateFontStyleButtons();
  }

  function updateFontStyleButtons() {
      const style = localStorage.getItem('reader_font_style') || 'songke';
      ['songke', 'script', 'system'].forEach(name => {
          const btn = document.getElementById(`font-${name}-btn`);
          if (btn) btn.classList.toggle('active', name === style);
      });
  }

  function applyReaderPreferences() {
      setReaderFontStyle(localStorage.getItem('reader_font_style') || 'songke');
      setReaderTheme(localStorage.getItem('reader_theme') === 'night' ? 'night' : 'day');
      const savedSize = localStorage.getItem('reader_font_size') || 18;
      updateFontSize(savedSize, false);
      const savedLineHeight = localStorage.getItem('reader_line_height') || 2;
      updateLineHeight(savedLineHeight, false);
  }

  // Bookmark Logic
  function toggleBookmarks() {
      const modal = document.getElementById('bookmarks-modal');
      
      if (modal.style.display === 'none' || modal.style.display === '') {
          closeReaderPanels('bookmarks-modal');
          modal.style.display = 'block';
          renderBookmarks();
      } else {
          modal.style.display = 'none';
      }
  }

  function getBookmarkKey() {
      const urlParams = new URLSearchParams(window.location.search);
      // Use file name as key, fallback to title if file is missing (unlikely)
      return 'foli_bookmark_' + (urlParams.get('file') || 'unknown');
  }

  function getBookmarks() {
      const key = getBookmarkKey();
      try {
          return JSON.parse(localStorage.getItem(key) || '[]');
      } catch (e) {
          return [];
      }
  }

  function renderBookmarks() {
      const bookmarks = getBookmarks();
      const list = document.getElementById('bookmarks-list');
      const countEl = document.getElementById('bookmark-count');
      const addBtn = document.getElementById('add-bookmark-btn');
      
      countEl.innerText = bookmarks.length;
      addBtn.disabled = bookmarks.length >= 3;
      
      if (bookmarks.length === 0) {
          list.innerHTML = '<div class="text-center text-[var(--reader-muted)] text-sm py-4">暂无书签</div>';
          return;
      }

      list.innerHTML = bookmarks.map((b, index) => `
          <div class="p-3 reader-field rounded-xl flex justify-between items-center group hover:bg-white/60 transition-all">
              <div class="flex-1 cursor-pointer" onclick="jumpToBookmark(${b.percent})">
                  <div class="text-xs text-[var(--reader-muted)] mb-0.5">${new Date(b.timestamp).toLocaleString()}</div>
                  <div class="text-sm text-[var(--reader-text)] font-medium truncate w-48">${b.preview || '书签 ' + (index + 1)}</div>
                  <div class="text-[10px] text-[var(--reader-muted)]">进度: ${(b.percent * 100).toFixed(1)}%</div>
              </div>
              <button onclick="deleteBookmark(${index})" class="p-2 text-[var(--reader-muted)] hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors">
                  删除
              </button>
          </div>
      `).join('');
  }

  function addBookmark() {
      const bookmarks = getBookmarks();
      if (bookmarks.length >= 3) {
          alert('最多只能添加 3 个书签。');
          return;
      }

      // Calculate scroll percentage
      const docHeight = document.documentElement.scrollHeight - window.innerHeight;
      const scrollTop = window.scrollY;
      const percent = docHeight > 0 ? scrollTop / docHeight : 0;

      // Get preview text (approximate)
      // Try to find the visible element or just take a snippet from where we are?
      // Simple approach: Just use "進度 X%" as title, or try to grab text.
      // Let's try to grab the first text node in viewport.
      let preview = '书签';
      // This is a bit complex to do perfectly, so we'll just use "Progress X%" or user input?
      // User input is better but slower. Let's auto-generate.
      preview = `阅读进度 ${(percent * 100).toFixed(0)}%`;

      const newBookmark = {
          id: Date.now(),
          timestamp: Date.now(),
          percent: percent,
          preview: preview
      };

      bookmarks.unshift(newBookmark); // Add to top
      localStorage.setItem(getBookmarkKey(), JSON.stringify(bookmarks));
      renderBookmarks();
  }

  function deleteBookmark(index) {
      if(!confirm('确定删除此书签吗？')) return;
      const bookmarks = getBookmarks();
      bookmarks.splice(index, 1);
      localStorage.setItem(getBookmarkKey(), JSON.stringify(bookmarks));
      renderBookmarks();
  }

  function jumpToBookmark(percent) {
      const docHeight = document.documentElement.scrollHeight - window.innerHeight;
      const target = percent * docHeight;
      window.scrollTo({
          top: target,
          behavior: 'smooth'
      });
      // Close modal on mobile automatically? Maybe keep open.
      // Let's close it for better experience.
      toggleBookmarks();
  }

  // Settings Logic
  function toggleSettings() {
      const modal = document.getElementById('settings-modal');
      
      if (modal.style.display === 'none' || modal.style.display === '') {
          closeReaderPanels('settings-modal');
          modal.style.display = 'block';
          const currentSize = localStorage.getItem('reader_font_size') || 18;
          document.getElementById('font-size-slider').value = currentSize;
          updateFontSize(currentSize, false);
          const currentLineHeight = localStorage.getItem('reader_line_height') || 2;
          const lineHeightSlider = document.getElementById('line-height-slider');
          if (lineHeightSlider) lineHeightSlider.value = currentLineHeight;
          updateLineHeight(currentLineHeight, false);
          updateThemeButtons();
          updateFontStyleButtons();
      } else {
          modal.style.display = 'none';
      }
  }

  function updateFontSize(val, save=true) {
      // Update label
      document.getElementById('font-size-label').innerText = val + 'px';
      
      // Update preview in modal
      const preview = document.getElementById('settings-preview-text');
      if(preview) preview.style.fontSize = val + 'px';
      
      // Update Actual Content Live!
      const content = document.getElementById('article-content');
      if(content) content.style.fontSize = val + 'px';

      // Save
      if(save) {
          localStorage.setItem('reader_font_size', val);
      }
  }

  function updateLineHeight(val, save=true) {
      const normalized = Number(val).toFixed(1);
      const label = document.getElementById('line-height-label');
      if (label) label.innerText = normalized;
      const content = document.getElementById('article-content');
      if (content) content.style.lineHeight = normalized;
      const preview = document.getElementById('settings-preview-text');
      if (preview) preview.style.lineHeight = normalized;
      if (save) localStorage.setItem('reader_line_height', normalized);
  }

  // Go Back Logic
  function goBack() {
      const urlParams = new URLSearchParams(window.location.search);
      const from = urlParams.get('from');
      const query = urlParams.get('query');
      
      if (from === 'search') {
          // Return to search tab and restore query so results show again
          const base = 'index.html';
          const qs = (query && query.trim()) ? '?query=' + encodeURIComponent(query.trim()) : '';
          window.location.href = base + qs + '#search';
      } else {
          // Default to Dharma persistence
          localStorage.setItem('dharma_tab_state', 'sutras');
          window.location.href = 'index.html#dharma_sutras';
      }
  }

  // Initialize
  document.addEventListener('DOMContentLoaded', () => {
      // Apply Language
      document.title = t('reader_title');
      document.querySelectorAll('[data-i18n]').forEach(el => {
         const key = el.getAttribute('data-i18n');
         el.innerHTML = t(key); // Use innerHTML to support <br> in preview_text
      });

      applyReaderPreferences();
  });

  // Get params
  const urlParams = new URLSearchParams(window.location.search);
  const fileName = urlParams.get('file');
  const title = urlParams.get('title');

  // Set Title
  if (title) {
      const headerTitle = document.getElementById('header-title');
      headerTitle.innerText = title;
      // Remove data-i18n to prevent overwriting by i18n script on DOMContentLoaded
      headerTitle.removeAttribute('data-i18n');
      
      document.getElementById('article-title').innerText = title;
  }

  // Helper: Escape HTML
  function escapeHtml(text) {
      if (!text) return "";
      return text
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
  }

  // Helper: Highlight Text and Generate Minimap
  function renderContentWithHighlight(text) {
      const contentDiv = document.getElementById('article-content');
      const minimap = document.getElementById('minimap');
      const query = urlParams.get('query');
      if (minimap) minimap.innerHTML = '';

      try {
          const q = query && query.trim() ? query.trim() : '';
          const regex = q ? new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi') : null;
          let highlightedCount = 0;
          const maxHighlights = 300;
          const chapterPattern = /^(新印.*序|.*經序|.*经序|.*卷第[一二三四五六七八九十百千\d]+|卷第[一二三四五六七八九十百千\d]+|.*品第[一二三四五六七八九十百千\d]+|[一二三四五六七八九十百千\d]+、.{2,32})$/;
          let chapterIndex = 0;

          function highlightEscaped(escaped) {
              if (!regex) return escaped;
              return escaped.replace(regex, match => {
                  if (highlightedCount >= maxHighlights) return match;
                  highlightedCount += 1;
                  return `<span class="highlight-match">${match}</span>`;
              });
          }

          const lines = String(text || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
          const html = lines.map(line => {
              const trimmed = line.trim();
              const escaped = highlightEscaped(escapeHtml(line));
              if (trimmed && trimmed.length <= 44 && chapterPattern.test(trimmed)) {
                  const id = `reader-chapter-${chapterIndex++}`;
                  return `<h2 id="${id}" class="reader-chapter" data-toc-title="${escapeHtml(trimmed)}">${highlightEscaped(escapeHtml(trimmed))}</h2>`;
              }
              return escaped;
          }).join('\n');

          contentDiv.innerHTML = html;
          buildToc();

          requestAnimationFrame(() => {
             const matches = contentDiv.querySelectorAll('.highlight-match');
             const containerHeight = contentDiv.scrollHeight;

             if (minimap && matches.length > 0 && containerHeight > 0) {
                 const fragment = document.createDocumentFragment();
                 matches.forEach(match => {
                     const top = match.offsetTop;
                     const percent = (top / containerHeight) * 100;
                     const marker = document.createElement('div');
                     marker.className = 'minimap-marker';
                     marker.style.top = `${percent}%`;
                     fragment.appendChild(marker);
                 });
                 minimap.appendChild(fragment);

                 setTimeout(() => {
                     matches[0].scrollIntoView({ behavior: 'smooth', block: 'start' });
                 }, 300);
             }
          });
      } catch(e) {
          console.error("Highlight error", e);
          contentDiv.innerText = text;
          buildToc();
      }
  }

  // Helper: Lazy Load Search Data
  let isSearchDataLoading = false;
  let searchDataLoadFailed = false;
  function loadSearchData() {
    if (typeof SEARCH_DATA !== 'undefined') return Promise.resolve();
    if (searchDataLoadFailed) return Promise.reject(new Error('search_data.js unavailable'));
    if (isSearchDataLoading) return new Promise((resolve, reject) => {
        const check = setInterval(() => {
            if (typeof SEARCH_DATA !== 'undefined') {
                clearInterval(check);
                resolve();
            } else if (searchDataLoadFailed) {
                clearInterval(check);
                reject(new Error('search_data.js unavailable'));
            }
        }, 100);
    });

    isSearchDataLoading = true;
    return new Promise((resolve, reject) => {
         const script = document.createElement('script');
         script.src = 'search_data.js?v=22.3';
         script.onload = () => {
            isSearchDataLoading = false;
            resolve();
        };
        script.onerror = () => {
            isSearchDataLoading = false;
            searchDataLoadFailed = true;
            reject(new Error('failed to load search_data.js'));
        };
        document.head.appendChild(script);
    });
  }

  function tryLoadFromSearchData(fName) {
      if (typeof SEARCH_DATA === 'undefined') return false;
      const decodedName = decodeURIComponent(fName);
      const basename = fName.split('/').pop();
      
      const found = SEARCH_DATA.find(item => item.id === decodedName || item.id === basename || item.title === decodedName || item.title === basename);
      
      if (found) {
          let data = found.content;
          if (typeof data === 'object' && data.value) data = data.value;
          
          renderContentWithHighlight(data);
          
          if (!title) {
              const hTitle = document.getElementById('header-title');
              hTitle.innerText = found.title;
              hTitle.removeAttribute('data-i18n');
          }
          document.getElementById('article-title').innerText = found.title;
          
          const savedSize = localStorage.getItem('reader_font_size');
          if(savedSize) document.getElementById('article-content').style.fontSize = savedSize + 'px';
          
          return true;
      }
      return false;
  }

  function tryLoadTransferredDocument(fName) {
      try {
          const raw = sessionStorage.getItem('foli_reader_document');
          if (!raw) return false;

          const item = JSON.parse(raw);
          const decodedName = decodeURIComponent(fName);
          const basename = fName.split('/').pop();
          if (!item || (item.id !== decodedName && item.id !== basename)) return false;
          if (typeof item.content !== 'string') return false;

          renderContentWithHighlight(item.content);

          const documentTitle = item.title || decodedName.replace(/\.[^/.]+$/, '');
          if (!title) {
              const hTitle = document.getElementById('header-title');
              hTitle.innerText = documentTitle;
              hTitle.removeAttribute('data-i18n');
          }
          document.getElementById('article-title').innerText = documentTitle;

          const savedSize = localStorage.getItem('reader_font_size');
          if (savedSize) document.getElementById('article-content').style.fontSize = savedSize + 'px';
          return true;
      } catch (error) {
          console.warn('Unable to load transferred reader document', error);
          return false;
      }
  }

  function tryLoadFromSutrasData(fName) {
      if (typeof SUTRAS_DATA === 'undefined') return false;
      const basename = fName.split('/').pop();
      const decodedName = decodeURIComponent(basename);
      
      let data = null;
      if (SUTRAS_DATA[decodedName]) data = SUTRAS_DATA[decodedName];
      else if (SUTRAS_DATA[basename]) data = SUTRAS_DATA[basename];

      if (data) {
          if (typeof data === 'object' && data.value) data = data.value;
          renderContentWithHighlight(data);
          return true;
      }
      return false;
  }

  // Load Content
  if (fileName) {
      (async () => {
          // 1. Use the selected search result without loading the full index.
          if (tryLoadTransferredDocument(fileName)) return;

          // 2. Try data already bundled on this page.
          if (tryLoadFromSearchData(fileName)) return;
          if (tryLoadFromSutrasData(fileName)) return;

          // 3. Try Network Fetch
          try {
              const response = await fetch(fileName);
              
              // Check for valid response (Vercel rewrites might return index.html for missing files)
              const contentType = response.headers.get('content-type');
              if (!response.ok || (contentType && contentType.includes('text/html'))) {
                   throw new Error('Network response was not ok or returned HTML');
              }

              const text = await response.text();
              
              // Double check content
              if (text.trim().startsWith('<!DOCTYPE') || text.trim().startsWith('<html')) {
                  throw new Error('Returned HTML instead of text');
              }

              renderContentWithHighlight(text);
          } catch (error) {
              console.warn('Fetch failed, attempting offline fallback...', error);
              
              // 4. Legacy/direct-link fallback: Lazy Load Big Data
              document.getElementById('article-content').innerHTML = `
                <div class="flex flex-col items-center justify-center py-20 text-[#8B4513]/40 gap-3">
                    <svg class="animate-spin h-8 w-8 text-[#8B4513]" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span class="text-sm">正在嘗試離線加載 (15MB)...</span>
                </div>
              `;

              try {
                  await loadSearchData();
                  if (tryLoadFromSearchData(fileName)) return;
                  throw new Error('Not found in offline database');
              } catch (offlineError) {
                   console.error('Offline load failed:', offlineError);
                   document.getElementById('article-content').innerHTML = `
                    <div class="p-4 bg-red-50 text-red-600 rounded-xl text-center border border-red-100">
                        <div class="font-bold mb-2">載入失敗</div>
                        <div class="text-sm opacity-80">無法加載內容。請檢查網絡連接。</div>
                        <div class="text-xs mt-2 text-stone-400">${fileName}</div>
                    </div>
                `;
              }
          }
      })();
  } else {
      document.getElementById('article-content').innerText = "未指定文章檔案。";
  }
</script>
<script>
  (function() {
    if (!('serviceWorker' in navigator)) return;
    var reg = null;
    function showReaderUpdateBanner() {
      if (document.getElementById('reader-update-banner')) return;
      var b = document.createElement('div');
      b.id = 'reader-update-banner';
      b.className = 'fixed bottom-4 left-4 right-4 z-50 px-4 py-2 rounded-xl bg-amber-100 border border-amber-300 text-center text-sm text-[#5c4033] shadow-lg';
      b.innerHTML = '<span>發現新版本</span> <button type="button" class="ml-2 font-bold text-[#b35c1e] underline">點擊更新</button>';
      b.querySelector('button').onclick = function() {
        if (reg && reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
      };
      document.body.appendChild(b);
    }
    navigator.serviceWorker.register('/sw-v2.js?v=22.7').then(function(r) {
      reg = r;
      if (r.waiting && navigator.serviceWorker.controller) showReaderUpdateBanner();
      r.onupdatefound = function() {
        var w = r.installing;
        if (w) w.onstatechange = function() {
          if (w.state === 'installed' && navigator.serviceWorker.controller) showReaderUpdateBanner();
        };
      };
    });
    navigator.serviceWorker.addEventListener('controllerchange', function() { window.location.reload(); });
  })();
</script>
