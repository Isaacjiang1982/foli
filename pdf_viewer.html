<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>早课，晚课，金刚经文字版</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    if (!window.tailwind) {
      document.write('<script src="tailwindcss.js?v=22.1"><\/script>');
    }
  </script>
  <style>
    body {
      font-family: "PingFang SC", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 82% -8%, rgba(255,255,238,.82) 0%, rgba(245,218,145,.34) 36%, transparent 66%),
        linear-gradient(145deg, #d6b773 0%, #f2e4c8 42%, #f8efd9 100%);
      color: #3f3127;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <header class="sticky top-0 z-20 flex items-center gap-3 px-4 py-3 bg-white/75 backdrop-blur-xl border-b border-white/60 shadow-sm">
    <button onclick="goBackToPractice()" class="w-10 h-10 flex items-center justify-center rounded-full bg-white/65 border border-white/70 text-[#8B4513] active:scale-95 transition-all" aria-label="返回修行">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="2.25" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
      </svg>
    </button>
    <div class="min-w-0 flex-1">
      <div id="pdf-title" class="text-base font-bold text-[#5c4033] truncate">早课，晚课，金刚经文字版</div>
      <div class="text-[11px] text-[#8B4513]/60">打开 PDF 后，可关闭 PDF 页或返回此页</div>
    </div>
  </header>

  <main class="flex-1 px-4 py-6 flex items-center justify-center">
    <section class="w-full max-w-md rounded-3xl bg-white/55 backdrop-blur-xl border border-white/70 shadow-[0_18px_60px_rgba(83,54,24,0.12)] p-5">
      <div class="text-[#8B4513] text-xs font-bold uppercase tracking-wider mb-2 flex items-center gap-2">
        <span class="w-1.5 h-1.5 rounded-full bg-[#8B4513]"></span>
        共修文字版
      </div>
      <h1 class="text-2xl font-bold text-[#5c4033] leading-snug mb-2">早课，晚课，金刚经文字版</h1>
      <p class="text-sm text-[#8B4513]/70 leading-relaxed mb-5">
        PDF 将在新窗口打开。本页保留返回按钮，方便回到修行页。
      </p>
      <div class="space-y-3">
        <a id="pdf-open-link" href="practice/(早課，晚課，金剛經)文字版.pdf" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center gap-2 w-full py-3 rounded-2xl bg-[#8B4513] text-white text-base font-bold shadow-md active:scale-[0.98] transition-all">
          打开文字版 PDF
        </a>
        <button onclick="goBackToPractice()" class="w-full py-3 rounded-2xl bg-white/65 text-[#8B4513] text-base font-bold border border-white/70 active:scale-[0.98] transition-all">
          返回修行
        </button>
      </div>
    </section>
  </main>

  <script>
    function goBackToPractice() {
      localStorage.setItem('dharma_tab_state', 'chant');
      window.location.href = 'index.html#chant';
    }

    const params = new URLSearchParams(window.location.search);
    const title = params.get('title') || '早课，晚课，金刚经文字版';
    document.title = title;
    document.getElementById('pdf-title').textContent = title;

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw-v2.js?v=23.0');
    }
  </script>
</body>
</html>
