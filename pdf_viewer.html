<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文字版</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    if (!window.tailwind) {
      document.write('<script src="tailwindcss.js?v=22.1"><\/script>');
    }
  </script>
  <style>
    body {
      font-family: "PingFang SC", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 82% -8%, rgba(255,255,238,.82) 0%, rgba(245,218,145,.34) 36%, transparent 66%),
        linear-gradient(145deg, #d6b773 0%, #f2e4c8 42%, #f8efd9 100%);
      color: #3f3127;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <header class="sticky top-0 z-20 flex items-center justify-between gap-3 px-4 py-3 bg-white/70 backdrop-blur-xl border-b border-white/60 shadow-sm">
    <button onclick="goBackToPractice()" class="w-10 h-10 flex items-center justify-center rounded-full bg-white/60 border border-white/70 text-[#8B4513] active:scale-95 transition-all" aria-label="返回修行">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="2.25" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
      </svg>
    </button>
    <div id="pdf-title" class="flex-1 text-center text-base font-bold text-[#5c4033] truncate">文字版</div>
    <a id="pdf-open-link" href="#" target="_blank" rel="noopener noreferrer" class="w-10 h-10 flex items-center justify-center rounded-full bg-white/60 border border-white/70 text-[#8B4513] active:scale-95 transition-all" aria-label="新窗口打开">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="2.25" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 0 0 3 8.25v10.5A2.25 2.25 0 0 0 5.25 21h10.5A2.25 2.25 0 0 0 18 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25" />
      </svg>
    </a>
  </header>

  <main class="flex-1 p-3 sm:p-4">
    <div class="h-[calc(100vh-5.5rem)] rounded-2xl overflow-hidden bg-white/55 border border-white/70 shadow-[0_18px_60px_rgba(83,54,24,0.12)]">
      <iframe id="pdf-frame" title="文字版 PDF" class="w-full h-full bg-white" loading="lazy"></iframe>
    </div>
  </main>

  <script>
    function goBackToPractice() {
      localStorage.setItem('dharma_tab_state', 'chant');
      window.location.href = 'index.html#chant';
    }

    const params = new URLSearchParams(window.location.search);
    const file = params.get('file') || 'practice/(早課，晚課，金剛經)文字版.pdf';
    const title = params.get('title') || '文字版';
    document.title = title;
    document.getElementById('pdf-title').textContent = title;
    document.getElementById('pdf-frame').src = file;
    document.getElementById('pdf-open-link').href = file;

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw-v2.js?v=22.8');
    }
  </script>
</body>
</html>
